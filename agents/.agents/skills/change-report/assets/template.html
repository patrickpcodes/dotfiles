<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: "IBM Plex Sans", "Segoe UI", sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  --bg: #f5f6f3; --surface: #ffffff; --surface2: #eef1f1; --surface3: #e2e7e8; --border: #d3dbde; --code-bg: #fbfcfc;
  --text: #1b2730; --text-dim: #5b6a75; --gutter: #98a5ae;
  --teal: #1d7a71; --amber: #9a5d0c; --blue: #2c6a99; --red: #b8402f;
  --add: #1c7f50; --add-bg: rgba(28,127,80,.10); --add-text: #14472f;
  --del: #b8402f; --del-bg: rgba(184,64,47,.09); --del-text: #5e1d14;
  --hunk-bg: rgba(44,106,153,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1317; --surface: #151c22; --surface2: #1b242c; --surface3: #222d36; --border: #2a3742; --code-bg: #0b1014;
    --text: #e2e8ec; --text-dim: #8d9aa5; --gutter: #4f5d69;
    --teal: #4fb3a9; --amber: #e3a54a; --blue: #6fa8d6; --red: #e46a5f;
    --add: #47b884; --add-bg: rgba(71,184,132,.11); --add-text: #b9e8cf;
    --del: #e46a5f; --del-bg: rgba(228,106,95,.11); --del-text: #f2c3be;
    --hunk-bg: rgba(111,168,214,.09);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); padding: 32px 40px 80px; overflow-wrap: break-word; }
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: var(--mono); font-size: .88em; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 220px 1fr; gap: 0 40px; }
.main { min-width: 0; }

.toc { position: sticky; top: 24px; align-self: start; grid-row: 1 / -1; max-height: calc(100dvh - 48px); overflow-y: auto; padding: 6px 0; }
.toc::-webkit-scrollbar { width: 3px; }
.toc::-webkit-scrollbar-thumb { background: var(--surface3); }
.toc-group { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); padding: 0 0 8px; margin: 18px 0 6px; border-bottom: 1px solid var(--border); }
.toc-group:first-child { margin-top: 0; }
.toc a { display: block; color: var(--text-dim); padding: 3px 8px; border-left: 2px solid transparent; border-radius: 4px; overflow-wrap: anywhere; }
.toc a:hover { color: var(--text); background: var(--surface2); text-decoration: none; }
.toc a.sec { font-weight: 600; font-size: 12px; margin-top: 6px; color: var(--text); }
.toc a.file { font: 11px var(--mono); padding-left: 16px; }
.toc a.active { color: var(--text); border-left-color: var(--amber); background: var(--surface); }
.toc code { background: none; padding: 0; }

.top { margin-bottom: 22px; }
.eyebrow { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 2px; color: var(--amber); margin: 0 0 6px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.4px; text-wrap: balance; }
h1 code { color: var(--amber); background: none; padding: 0; font-size: .86em; }
.lede { font-size: 17px; margin: 0 0 8px; max-width: 900px; }
.subtitle { color: var(--text-dim); margin: 0; max-width: 1000px; }
.summary-note { margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; background: var(--surface); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin-bottom: 30px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.kpi b { display: block; font: 600 24px var(--mono); }
.kpi span { color: var(--text-dim); font-size: 12px; }
.kpi.add b { color: var(--add); } .kpi.del b { color: var(--del); }

.sec-head { font-size: 20px; margin: 34px 0 6px; padding-bottom: 8px; border-bottom: 2px solid var(--amber); scroll-margin-top: 16px; }
.sec-head span { font: 500 12px var(--mono); color: var(--text-dim); margin-left: 8px; }
.story { scroll-margin-top: 16px; }
.story .sec-head { border-bottom-color: var(--teal); }
.story:first-of-type .sec-head { margin-top: 0; }
.story:first-of-type .prose { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--teal); border-radius: 0 10px 10px 0; padding: 14px 20px; max-width: none; font-size: 15px; }
.prose { max-width: 900px; }
.prose p { margin: 10px 0; }
.prose h3 { font-size: 14px; margin: 18px 0 4px; }
.prose ul, .prose ol { margin: 8px 0; padding-left: 22px; }
.prose li { margin: 4px 0; }
.caption { color: var(--text-dim); font-size: 12px; margin: 6px 0 0; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin: 34px 0; scroll-margin-top: 16px; }
.panel h2 { margin: 0 0 12px; font-size: 17px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 7px 10px; border-bottom: 1px solid var(--surface3); vertical-align: top; overflow-wrap: anywhere; }
.glance td:first-child { font-family: var(--mono); font-size: 12px; min-width: 230px; }
.story-table { margin-top: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
.story-table tr:last-child td { border-bottom: 0; }
.r-ok { color: var(--add); font-weight: 600; } .r-bad { color: var(--del); font-weight: 600; } .r-na { color: var(--text-dim); font-weight: 600; font-style: italic; }
td.num, .nowrap { white-space: nowrap; }
td.num, .mono { font-family: var(--mono); font-size: 12px; }
.glance tr.grp td { background: var(--surface2); font: 600 12px var(--font); padding-top: 9px; }
.dir { color: var(--text-dim); font-size: 11px; font-family: var(--mono); }
.dim { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }
.st { display: inline-block; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .8px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 4px; white-space: nowrap; }
.st.A { color: var(--add); } .st.M { color: var(--amber); } .st.D { color: var(--del); } .st.R { color: var(--blue); }
.plus { color: var(--add); font-family: var(--mono); } .minus { color: var(--del); font-family: var(--mono); }

.group { margin-bottom: 30px; }
.blurb { color: var(--text-dim); margin: 6px 0 16px; max-width: 900px; }
.blurb p { margin: 0 0 6px; }
.file-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 18px; overflow: hidden; scroll-margin-top: 16px; }
.file-card header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.file-card .name { min-width: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.file-card .name .dir { display: inline; font-size: 12px; }
.file-card .tags { display: flex; gap: 10px; align-items: center; flex: none; font-size: 12px; }
.why { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--teal); }
.file-note { margin: 0; padding: 6px 14px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }
.nodiff { margin: 0; padding: 12px 14px; color: var(--text-dim); font-style: italic; background: var(--code-bg); }
pre.diff { margin: 0; max-height: 560px; overflow: auto; background: var(--code-bg); font: 12px/1.5 var(--mono); tab-size: 4; }
pre.diff code { display: block; min-width: max-content; background: none; padding: 0; border-radius: 0; font-size: inherit; }
.l { display: flex; white-space: pre; }
.l .g { flex: none; width: 46px; padding-right: 8px; text-align: right; color: var(--gutter); user-select: none; }
.l .m { flex: none; width: 18px; text-align: center; user-select: none; color: var(--text-dim); }
.l .t { padding-right: 16px; }
.l.add { background: var(--add-bg); } .l.add .t { color: var(--add-text); } .l.add .m { color: var(--add); }
.l.del { background: var(--del-bg); } .l.del .t { color: var(--del-text); } .l.del .m { color: var(--del); }
.l.hunk { background: var(--hunk-bg); } .l.hunk .t { color: var(--blue); }
.l.meta .t { color: var(--text-dim); font-style: italic; }
.note { color: var(--text-dim); font-size: 12px; }
.foot { margin-top: 40px; }

.diagram-shell { position: relative; margin-top: 12px; }
.diagram-shell__hint { font: 11px var(--mono); color: var(--text-dim); margin: 0 0 8px; opacity: .8; }
.mermaid-wrap { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-height: 360px; overflow: hidden; cursor: grab; }
.mermaid-wrap.is-panning { cursor: grabbing; user-select: none; }
.mermaid-viewport { position: absolute; inset: 0; overflow: hidden; }
.mermaid-canvas { position: absolute; top: 0; left: 0; }
.mermaid-canvas pre { margin: 16px; font: 12px var(--mono); color: var(--text-dim); white-space: pre-wrap; }
.zoom-controls { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 2px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.zoom-controls button { min-width: 28px; height: 28px; padding: 0 5px; white-space: nowrap; border: 0; background: transparent; color: var(--text-dim); font: 13px var(--mono); cursor: pointer; border-radius: 4px; }
.zoom-controls button:hover { background: var(--surface2); color: var(--text); }
.zoom-label { font: 10px var(--mono); color: var(--text-dim); padding: 0 6px; white-space: nowrap; }
.mermaid .nodeLabel { color: var(--text) !important; font-family: var(--font) !important; }
.mermaid .edgeLabel { color: var(--text-dim) !important; background-color: var(--surface) !important; font-family: var(--mono) !important; font-size: 12px !important; }
.mermaid .edgeLabel rect { fill: var(--surface) !important; }
.mermaid .node rect, .mermaid .node polygon, .mermaid .node circle, .mermaid .edge-pattern-solid { stroke-width: 1.5px !important; }

@media (max-width: 1000px) {
  body { padding: 0 16px 60px; }
  .wrap { grid-template-columns: 1fr; }
  .toc { position: sticky; top: 0; z-index: 20; display: flex; gap: 4px; align-items: center; overflow-x: auto; max-height: none; background: var(--bg); border-bottom: 1px solid var(--border); margin: 0 -16px 16px; padding: 8px 16px; grid-row: auto; }
  .toc::-webkit-scrollbar { display: none; }
  .toc-group, .toc a.file { display: none; }
  .toc a.sec { white-space: nowrap; flex: none; margin: 0; border-left: 0; border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0; }
  .toc a.active { border-bottom-color: var(--amber); }
  .main { padding-top: 12px; }
  .sec-head, .file-card, .story, .panel { scroll-margin-top: 56px; }
  .file-card header { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
html.embed {
  --bg: var(--background, #0e1317); --surface: var(--card, #151c22); --surface2: var(--secondary, #1b242c); --surface3: var(--muted, #222d36);
  --code-bg: var(--code-background, #0b1014); --text: var(--foreground, #e2e8ec); --text-dim: var(--muted-foreground, #8d9aa5);
}
.embed body { background: none; padding: 0; }
.embed .wrap { display: block; }
.embed .toc { display: none; }
</style>
<script>if (self !== top) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="wrap">
<nav class="toc" id="toc">{{TOC}}</nav>
<main class="main">
{{MAIN}}
</main>
</div>
<script>
(function () {
  const only = document.getElementById(new URLSearchParams(location.search).get('only') || '');
  for (let n = only; n && !n.classList.contains('main'); n = n.parentElement)
    [...n.parentElement.children].forEach(s => { if (s !== n && !s.matches('.top, .sec-head, header')) s.style.display = 'none'; });
  const links = [...document.querySelectorAll('#toc a')];
  const targets = links.map(l => document.getElementById(l.getAttribute('href').slice(1))).filter(Boolean);
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + e.target.id));
      const active = links.find(l => l.classList.contains('active'));
      if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }, { rootMargin: '-10% 0px -80% 0px' });
  targets.forEach(t => observer.observe(t));
})();
</script>
<script type="module">
const shells = [...document.querySelectorAll('.diagram-shell')];
if (shells.length) {
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  let mermaid;
  try {
    ({ default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'));
    mermaid.initialize({
      startOnLoad: false, theme: 'base', look: 'classic',
      flowchart: { htmlLabels: true, curve: 'basis' },
      themeVariables: {
        fontFamily: v('--font'), fontSize: '15px', background: v('--surface'),
        primaryColor: v('--surface2'), primaryBorderColor: v('--teal'), primaryTextColor: v('--text'),
        secondaryColor: v('--surface3'), secondaryBorderColor: v('--amber'), secondaryTextColor: v('--text'),
        tertiaryColor: v('--surface'), tertiaryBorderColor: v('--border'), tertiaryTextColor: v('--text'),
        clusterBkg: v('--surface'), clusterBorder: v('--border'), titleColor: v('--text-dim'),
        lineColor: v('--text-dim'), edgeLabelBackground: v('--surface'),
        noteBkgColor: v('--surface2'), noteBorderColor: v('--amber'), noteTextColor: v('--text'),
        actorBkg: v('--surface2'), actorBorder: v('--teal'), actorTextColor: v('--text'), signalColor: v('--text-dim'), signalTextColor: v('--text')
      }
    });
  } catch (err) {
    console.warn('Mermaid did not load', err);
  }
  shells.forEach(shell => initDiagram(shell, mermaid));
}

function initDiagram(shell, mermaid) {
  const wrap = shell.querySelector('.mermaid-wrap');
  const viewport = shell.querySelector('.mermaid-viewport');
  const canvas = shell.querySelector('.mermaid-canvas');
  const source = shell.querySelector('.diagram-source').textContent.trim();
  const label = shell.querySelector('.zoom-label');
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const pad = 24;
  let zoom = 1, panX = 0, panY = 0, svgW = 0, svgH = 0;

  function apply() {
    const svg = canvas.querySelector('svg');
    if (!svg) return;
    const vw = viewport.clientWidth, vh = viewport.clientHeight, w = svgW * zoom, h = svgH * zoom;
    panX = w + pad * 2 <= vw ? (vw - w) / 2 : clamp(panX, vw - w - pad, pad);
    panY = h + pad * 2 <= vh ? (vh - h) / 2 : clamp(panY, vh - h - pad, pad);
    svg.style.width = w + 'px';
    svg.style.height = h + 'px';
    canvas.style.transform = `translate(${panX}px, ${panY}px)`;
    label.textContent = Math.round(zoom * 100) + '%';
  }
  function fit() {
    if (!svgW) return;
    zoom = clamp(Math.min((viewport.clientWidth - pad * 2) / svgW, (viewport.clientHeight - pad * 2) / svgH), 0.1, 1.6);
    apply();
  }
  function zoomAt(factor, cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2) {
    const next = clamp(zoom * factor, 0.1, 6);
    panX = cx - (next / zoom) * (cx - panX);
    panY = cy - (next / zoom) * (cy - panY);
    zoom = next;
    apply();
  }
  function expand() {
    const svg = canvas.querySelector('svg');
    if (!svg) return;
    const clone = svg.cloneNode(true);
    clone.style.width = clone.style.height = '';
    const bg = getComputedStyle(document.body).backgroundColor;
    const page = `<!DOCTYPE html><meta charset="utf-8"><title>Diagram</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:${bg};padding:32px;box-sizing:border-box}svg{max-width:100%;max-height:92vh;height:auto}</style>${clone.outerHTML}`;
    open(URL.createObjectURL(new Blob([page], { type: 'text/html' })), '_blank');
  }

  const actions = { 'zoom-in': () => zoomAt(1.15), 'zoom-out': () => zoomAt(1 / 1.15), 'zoom-fit': fit, 'zoom-one': () => { zoom = 1; apply(); }, 'zoom-expand': expand };
  Object.entries(actions).forEach(([a, fn]) => wrap.querySelector(`[data-action="${a}"]`).addEventListener('click', fn));
  viewport.addEventListener('dblclick', fit);
  viewport.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  viewport.addEventListener('mousedown', e => {
    const sx = e.clientX, sy = e.clientY, px = panX, py = panY;
    wrap.classList.add('is-panning');
    const move = ev => { panX = px + ev.clientX - sx; panY = py + ev.clientY - sy; apply(); };
    const up = () => { wrap.classList.remove('is-panning'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
    e.preventDefault();
  });
  new ResizeObserver(fit).observe(wrap);

  (async () => {
    if (!mermaid) {
      canvas.innerHTML = '<pre></pre>';
      canvas.firstChild.textContent = source;
      label.textContent = 'Mermaid not loaded';
      return;
    }
    try {
      const { svg } = await mermaid.render('d' + Math.random().toString(36).slice(2), source);
      const node = new DOMParser().parseFromString(svg, 'text/html').body.querySelector('svg');
      canvas.replaceChildren(document.adoptNode(node));
      const vb = node.viewBox && node.viewBox.baseVal;
      svgW = (vb && vb.width) || parseFloat(node.getAttribute('width')) || node.getBBox().width;
      svgH = (vb && vb.height) || parseFloat(node.getAttribute('height')) || node.getBBox().height;
      node.removeAttribute('width');
      node.removeAttribute('height');
      node.style.maxWidth = 'none';
      node.style.display = 'block';
      wrap.style.height = Math.round(clamp((svgH / svgW) * wrap.clientWidth + pad * 2, 360, Math.min(820, innerHeight * 0.8))) + 'px';
      fit();
    } catch (err) {
      console.error('Mermaid render failed', err);
      label.textContent = 'Error: ' + (err.message || 'render failed');
    }
  })();
}
</script>
</body>
</html>
